name: Build IPA

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed only to attach the IPA to a release on tags

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun swiftc --version

      - name: Compile (unsigned, arm64)
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          APP="build/Payload/iNoty.app"
          rm -rf build
          mkdir -p "$APP"

          xcrun --sdk iphoneos swiftc \
            -sdk "$SDK" \
            -target arm64-apple-ios15.0 \
            -swift-version 5 \
            -O \
            -parse-as-library \
            -module-name iNoty \
            Sources/*.swift \
            -o "$APP/iNoty"

          cp Info.plist "$APP/Info.plist"
          plutil -lint "$APP/Info.plist"

      - name: Package IPA
        run: |
          set -euo pipefail
          cd build
          zip -qr iNoty.ipa Payload
          unzip -l iNoty.ipa
          lipo -info Payload/iNoty.app/iNoty

      - uses: actions/upload-artifact@v4
        with:
          name: iNoty-ipa
          path: build/iNoty.ipa

      - name: Attach IPA to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/iNoty.ipa --generate-notes
